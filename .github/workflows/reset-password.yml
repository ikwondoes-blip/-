# 총무 PC 화면(⑥ 비밀번호 초기화)이 호출합니다. 직접 실행할 필요는 없습니다.
# 필요한 저장소 Secret: FIREBASE_SERVICE_ACCOUNT (배포용과 같은 서비스 계정 키)
name: 직원 비밀번호 초기화

on:
  workflow_dispatch:
    inputs:
      member_id:
        description: '직원 계정 ID (u로 시작, 총무 PC 화면이 자동으로 채움)'
        required: true
      temp_password:
        description: '임시 비밀번호 (총무 PC 화면이 자동으로 만듦)'
        required: true

concurrency:
  group: account-admin
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Firebase Admin SDK 설치
        run: npm install --prefix "$RUNNER_TEMP/sdk" firebase-admin@12 --no-audit --no-fund --silent
      - name: 비밀번호 초기화
        env:
          ADMIN_SDK_DIR: ${{ runner.temp }}/sdk
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MEMBER_ID: ${{ inputs.member_id }}
          TEMP_PASSWORD: ${{ inputs.temp_password }}
        run: node .github/scripts/reset-password.mjs
