# main에 fund/ 변경이 합쳐지면 직원 앱을 Firebase Hosting(https://asudi-fund.web.app)에 올립니다.
# 필요한 저장소 Secret: FIREBASE_SERVICE_ACCOUNT (서비스 계정 키 JSON 전체)
name: 직원 앱 배포 (Firebase Hosting)

on:
  push:
    branches: [main]
    paths:
      - 'fund/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: asudi-fund
          channelId: live
